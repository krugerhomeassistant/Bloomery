services:
  bloomery:
    build: .
    image: bloomery:latest
    container_name: bloomery
    restart: unless-stopped
    ports:
      - "${BLOOMERY_PORT:-8420}:8000"
    env_file: .env
    volumes:
      - ./data:/data

  # Optional local LLM. Start with:  docker compose --profile ai up -d
  # then pull a model once:          docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    container_name: bloomery-ollama
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ./ollama:/root/.ollama
    # Uncomment for NVIDIA GPU acceleration (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
