name: Feature request
description: Suggest an idea for Bloomery
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need rather than the solution, if you can.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How could Bloomery help?
