name: Bug report
description: Something in Bloomery or the Home Assistant integration isn't working
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Bloomery app, Home Assistant integration, Docker / install, Imports, AI assistant, Notifications]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Profile footer or `/api/health`; for the integration, the version in HACS.
      placeholder: "1.2.0"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: "`docker logs bloomery`, or the integration's Download diagnostics (tokens are redacted). Please remove anything personal."
      render: text
