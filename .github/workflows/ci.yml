name: CI & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install ruff
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  backend:
    name: Backend tests + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q backend/tests
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend

  home-assistant:
    name: Home Assistant integration (tests, coverage, strict typing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install pytest-homeassistant-custom-component mypy
      - run: python -m pytest -c tests_ha/pytest.ini tests_ha -q --cov=custom_components.bloomery --cov-report=term-missing --cov-fail-under=95
      - run: mypy custom_components/bloomery

  image:
    name: Docker image
    needs: [lint, backend, home-assistant]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bloomery
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - name: Check every version matches the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 - "$V" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          found = {
              "backend": re.search(r'"(.+)"', open("backend/app/__init__.py").read()).group(1),
              "integration": json.load(open("custom_components/bloomery/manifest.json"))["version"],
              "frontend": json.load(open("frontend/package.json"))["version"],
          }
          bad = {k: x for k, x in found.items() if x != v}
          sys.exit(f"Version mismatch with tag {v}: {bad}. Run scripts/bump.py {v}" if bad else 0)
          PY
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$V] section"; exit 1; }
      - name: Package integration for HACS
        run: cd custom_components/bloomery && zip -r -X "$GITHUB_WORKSPACE/bloomery.zip" . -x '__pycache__/*'
      - name: Release notes from CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n**Docker:** `ghcr.io/%s/bloomery:%s` · **Home Assistant:** update *Bloomery* in HACS.\n' "${GITHUB_REPOSITORY_OWNER}" "$V" >> notes.md
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" bloomery.zip --title "Bloomery $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
